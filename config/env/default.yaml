scenario:
  num_nodes: 6
  num_humans: 10
  num_vehicles: 1
  seed: 42
  central_count: 1
  randomize_initial_state: True

mobility:
  human_walking_speed_kmh: 3.0
  vehicle_speed_kmh: 30.0
  edge_speed_kmh: 30.0

network:
  bidirectional_prob: 0.85
  speed_mean: ${env.mobility.edge_speed_kmh}
  capacity_mean: 10.0
  coord_mean: 0.0
  coord_std: 10.0
  central_node_count: ${env.scenario.central_count}
  extra_neighbors_per_central_node: null

poi:
  central_count: ${env.scenario.central_count}
  residential_ratio: 0.5
  a: 0.5  # frequency coefficient in poi_weight = a * frequency + b * necessity
  b: 0.5  # necessity coefficient in poi_weight = a * frequency + b * necessity
  poi_count_per_type: null
  poi_profiles:
    workplace:
      frequency: 0.40
      necessity: 0.40
    supermarket:
      frequency: 0.35
      necessity: 0.35
    healthcare:
      frequency: 0.25
      necessity: 0.25
  poi_area_probabilities:
    central: 0.75
    peripheral: 0.25
  residential_area_probabilities:
    central: 0.5
    peripheral: 0.5

reward:
  utility_mode: "equity"
  beta: 1.0
  alpha: 0.8
  xi: 1.0
  eta: 2.0
  epsilon: 1e-6
  reward_mode: "time_integrated_utility"
  normalize_utility: False
  clip_normalized_utility: False
  normalized_reward_scale: 100
  deduct_average_utility: True
  reward_potential: True
  vehicle_advantage: True
