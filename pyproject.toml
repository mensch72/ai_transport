[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_transport_accessibility_equity"
version = "0.1.0"
description = "Placeholder project for accessibility- and equity-oriented RL built on ai_transport."
dependencies = [
    "hydra-core>=1.3.2",
    "imageio[ffmpeg]>=2.37.3",
    "matplotlib>=3.10.9",
    "networkx>=3.6.1",
    "pettingzoo>=1.26.1",
    "scipy>=1.17.1",
    "shapely>=2.1.2",
    "snakeviz>=2.2.2",
    "stable-baselines3[extra]>=2.8.0",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"

[tool.uv]
package = false
