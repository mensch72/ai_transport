[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_transport"
version = "0.1.0"
description = "PettingZoo environment for AI governed public transport"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pettingzoo>=1.24.0",
    "numpy>=1.21.0",
    "gymnasium>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
